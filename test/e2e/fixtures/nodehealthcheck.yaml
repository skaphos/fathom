#
# E2E fixture: exercises every NodeHealthCheck type against the real kind node
# (#206). The headroom thresholds are both 0 so a busy CI disk can neither
# Warn nor Fail (the healthy spec requires every agent-side result to be Pass,
# and a node at 1% free is a valid state, not a failure of the check);
# nodehealthcheck-fail.yaml flips the disk threshold to force a deliberate
# Fail. KubeletHealthz and ContainerRuntime
# are the two privileged types: the agent runs on the host network and as root
# with the containerd socket mounted — kind nodes run containerd at the default
# socket path. The kind node is a control-plane node, so includeControlPlaneNodes
# must be set for the agent to schedule there. A short interval keeps the spec
# fast.
apiVersion: fathom.skaphos.io/v1alpha1
kind: NodeHealthCheck
metadata:
  name: nodehealth-e2e
  namespace: default
spec:
  includeControlPlaneNodes: true
  interval: 30s
  timeout: 20s
  checks:
    - type: DiskHeadroom
      path: /var/lib/kubelet
      warnPercentFree: 0
      criticalPercentFree: 0
    - type: InodeHeadroom
      path: /var/lib/kubelet
      warnPercentFree: 0
      criticalPercentFree: 0
    - type: NodeCondition
    - type: KubeletHealthz
    - type: ContainerRuntime
