#
# A 0.6.0-era resource at fathom.skaphos.io/v1alpha1 for the alpha-to-v1
# upgrade scenario in test/e2e/fathomctl_lifecycle_test.go. Derived from the
# shipped sample with the version rewound; do not "fix" it to v1.
apiVersion: fathom.skaphos.io/v1alpha1
kind: NodeCertificateCheck
metadata:
  labels:
    app.kubernetes.io/name: fathom
    app.kubernetes.io/managed-by: kustomize
  name: node-certificates
spec:
  # warnDays/criticalDays default to 30/7; a certificate expiring within
  # criticalDays (or already expired) is Fail, within warnDays is Warn.
  warnDays: 30
  criticalDays: 7
  # How often each node-agent re-scans and the operator refreshes the report.
  interval: 1h
  timeout: 30s
  historyLimit: 10
  # Control-plane certificates (kubeadm apiserver/etcd/front-proxy) live on
  # control-plane nodes. Scheduling the privileged agent there is an explicit
  # opt-in; uncomment to scan them:
  # includeControlPlaneNodes: true
  # paths: []   # omit to use the built-in default set, or pin explicit paths:
  # paths:
  #   - /etc/kubernetes/pki
  #   - /etc/kubernetes/admin.conf
  #   - /var/lib/kubelet/pki
