#
# Shipped alert rules over the fathom_check_* gauges (spec 001, FR-009a).
#
# FathomCheckStale is cadence-relative: it compares a check's age against that
# check's OWN published interval rather than one constant for the whole fleet
# (skaphos/fathom#277). A single absolute threshold cannot work — 900s suits the
# default 5m AddonCheck and false-positives continuously against a 1h
# NodeCertificateCheck. The multiplier below is the only tunable, and it means
# "this many missed runs before we care".
#
# The 0 "never ran" sentinel on fathom_check_last_run_timestamp_seconds makes
# a never-evaluated check fire FathomCheckStale right after the `for` window.
# A check whose cadence cannot be resolved publishes no interval series, so the
# join drops it and this rule does not cover it.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: fathom
    app.kubernetes.io/managed-by: kustomize
  name: check-alert-rules
  namespace: system
spec:
  groups:
    - name: fathom-checks
      rules:
        - alert: FathomCheckFailing
          expr: fathom_check_result{result=~"Fail|Error"} == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: 'Fathom check {{ $labels.kind }}/{{ $labels.name }} reports {{ $labels.result }}'
            description: 'Check {{ $labels.name }} (namespace {{ $labels.namespace }}) has reported {{ $labels.result }} for 10 minutes. Inspect it with: kubectl describe {{ $labels.kind }} {{ $labels.name }}'
        - alert: FathomCheckStale
          # 3 = the overdue allowance: three consecutive missed runs. Raise it
          # for a noisier cluster, lower it to detect wedges sooner.
          expr: >-
            time() - fathom_check_last_run_timestamp_seconds
            > 3 * fathom_check_interval_seconds
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 'Fathom check {{ $labels.kind }}/{{ $labels.name }} is stale'
            description: 'Check {{ $labels.name }} (namespace {{ $labels.namespace }}) has not completed an evaluation in over three times its own interval (0 = never ran). The last recorded result can no longer be trusted: the operator may be wedged, the check paused, or its target selector matching nothing. For a ClusterHealth the interval is its slowest contributing check, and the age is its stalest contributing evidence.'
