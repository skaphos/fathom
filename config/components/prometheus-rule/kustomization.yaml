#
# SAMPLE alert rules (PrometheusRule) — a worked example, not Fathom policy.
#
# Fathom emits signal; it does not fire alerts, so it does not decide what
# pages whom (skaphos/fathom#276). Its contract is the metric surface documented
# in docs/guides/monitoring.md ("The metric contract"): names, labels and
# semantics. These rules are one reasonable composition on top of it. Review
# the severities, `for` windows and the staleness allowance before enabling,
# and prefer copying them into your own rule set over consuming this component
# unchanged. Rule names and expressions here may change in any release.
#
# Requires the prometheus-operator CRDs in the cluster — which is why it is
# opt-in and the default overlay never references the monitoring.coreos.com API
# group on its own. Enable from an overlay (e.g.
# config/default/kustomization.yaml) via:
#
#   components:
#     - ../components/prometheus-rule
#
# Usually enabled together with ../components/prometheus (the ServiceMonitor
# that makes Prometheus scrape the metrics these rules evaluate).
#
# FathomCheckFailing: a check currently reports Fail/Error.
# FathomCheckStale: a check has not completed an evaluation within three of its
# own intervals — wedged operator, paused check, or a check that never ran.
# Both are build-validated by the verify-alert-rules task and pinned by
# scripts/alert_rules_gate_test.go; promtool-style rule unit tests are not run.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - prometheusrule.yaml
