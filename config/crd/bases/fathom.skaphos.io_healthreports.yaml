---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: healthreports.fathom.skaphos.io
spec:
  group: fathom.skaphos.io
  names:
    kind: HealthReport
    listKind: HealthReportList
    plural: healthreports
    singular: healthreport
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HealthReport is the Schema for the healthreports API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              Spec is immutable: a HealthReport is a point-in-time history record.
              The operator only ever creates reports (createOrReuseHealthReport);
              mutating one after the fact would rewrite history (SKA-576).
            properties:
              adapterName:
                description: AdapterName is the adapter identity that produced this
                  report.
                type: string
              adapterVersion:
                description: AdapterVersion is the adapter implementation version.
                type: string
              addonType:
                description: AddonType is the AddonCheck addon type used to select
                  the adapter.
                type: string
              attribution:
                description: |-
                  Attribution names the runtime revision and delegated authority this
                  report was produced under. Absent for built-in adapters, which have
                  neither.
                properties:
                  authority:
                    description: |-
                      Authority is the delegated binding, dedicated identity, check context and
                      leadership epoch the producing run was attributed to.
                    properties:
                      bindingGeneration:
                        description: |-
                          BindingGeneration is the binding's spec generation. Status-only binding
                          writes do not advance it and therefore do not invalidate evidence.
                        format: int64
                        minimum: 0
                        type: integer
                      bindingUID:
                        description: |-
                          BindingUID is the AddonDefinitionBinding incarnation that authorized the
                          run.
                        maxLength: 128
                        type: string
                      checkGeneration:
                        description: |-
                          CheckGeneration is the AddonCheck spec generation the run was attributed
                          to.
                        format: int64
                        minimum: 0
                        type: integer
                      checkUID:
                        description: CheckUID is this AddonCheck's incarnation.
                        maxLength: 128
                        type: string
                      leaderEpoch:
                        description: LeaderEpoch is the leadership epoch observed
                          when the run was admitted.
                        properties:
                          acquireTime:
                            description: AcquireTime is the declared acquireTime.
                            format: date-time
                            type: string
                          holderIdentity:
                            description: HolderIdentity is the declared holderIdentity.
                            maxLength: 253
                            minLength: 1
                            type: string
                          leaseTransitions:
                            description: LeaseTransitions is the declared leaseTransitions.
                            format: int32
                            minimum: 0
                            type: integer
                          leaseUID:
                            description: LeaseUID is the declared leaseUID.
                            maxLength: 128
                            minLength: 1
                            type: string
                        required:
                        - acquireTime
                        - holderIdentity
                        - leaseTransitions
                        - leaseUID
                        type: object
                      policyDigest:
                        description: |-
                          PolicyDigest fingerprints spec.policy. The policy selects which families
                          run, so evidence produced under one policy is not interchangeable with
                          evidence produced under another at the same generation.
                        maxLength: 128
                        type: string
                      serviceAccountUID:
                        description: |-
                          ServiceAccountUID is the dedicated reader incarnation the evaluation
                          impersonated.
                        maxLength: 128
                        type: string
                    type: object
                  coverage:
                    description: |-
                      Coverage distinguishes an assessed verdict from a completed run that
                      evaluated nothing, so a Skipped entry in history cannot be mistaken for
                      an assessed-and-healthy one.
                    enum:
                    - ChecksEvaluated
                    - NoChecksEvaluated
                    type: string
                  message:
                    description: |-
                      Message explains the coverage in one line. A report produced by a
                      completed all-Skipped run carries exactly
                      [AddonCheckNoChecksEvaluatedMessage].
                    maxLength: 1024
                    type: string
                  revision:
                    description: |-
                      Revision is the runtime definition revision that produced the report:
                      the definition incarnation plus the operator build and adapter version
                      that compiled it.
                    properties:
                      adapterVersion:
                        description: AdapterVersion is the compiled adapter's own
                          version.
                        maxLength: 128
                        type: string
                      definitionGeneration:
                        description: DefinitionGeneration is the definition's spec
                          generation.
                        format: int64
                        minimum: 0
                        type: integer
                      definitionUID:
                        description: |-
                          DefinitionUID is the AddonDefinition incarnation. A recreated definition
                          has a new UID and inherits no authority from the old one.
                        maxLength: 128
                        type: string
                      operatorBuild:
                        description: OperatorBuild is the operator build that compiled
                          the snapshot.
                        maxLength: 128
                        type: string
                      schemaVersion:
                        description: SchemaVersion is the API schema version the definition
                          was compiled from.
                        maxLength: 63
                        type: string
                      semanticsVersion:
                        description: SemanticsVersion is the declared evaluation semantics
                          version.
                        format: int32
                        minimum: 0
                        type: integer
                    type: object
                type: object
              checks:
                description: Checks are the individual observations produced by the
                  adapter.
                items:
                  description: HealthReportCheck records one adapter-emitted check
                    result.
                  properties:
                    details:
                      additionalProperties:
                        type: string
                      description: Details is adapter-defined structured context for
                        the check.
                      type: object
                    duration:
                      description: Duration is how long this check took.
                      type: string
                    family:
                      description: Family is the adapter-defined check family that
                        produced this result.
                      maxLength: 63
                      minLength: 1
                      type: string
                    observedAt:
                      description: ObservedAt is when this check completed.
                      format: date-time
                      type: string
                    result:
                      description: Result is this check's outcome.
                      enum:
                      - Pass
                      - Warn
                      - Fail
                      - Error
                      - Skipped
                      - Unknown
                      type: string
                    summary:
                      description: Summary is a human-readable one-line outcome description.
                      type: string
                    targetRef:
                      description: TargetRef is the observed resource for this check.
                      properties:
                        apiVersion:
                          description: APIVersion is the target object's API version.
                          maxLength: 253
                          type: string
                        kind:
                          description: Kind is the target object's kind.
                          maxLength: 63
                          type: string
                        name:
                          description: Name is the target object's name.
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          description: Namespace is the target object's namespace,
                            if namespaced.
                          maxLength: 253
                          type: string
                      required:
                      - name
                      type: object
                  required:
                  - family
                  - observedAt
                  - result
                  - targetRef
                  type: object
                type: array
              contractVersion:
                description: ContractVersion is the adapter contract version used
                  for this run.
                type: string
              detectedVersion:
                description: |-
                  DetectedVersion is the installed addon release version detected for this
                  run, or empty when undetectable or not detected. Distinct from
                  AdapterVersion (the adapter's own version) — SKA-527.
                type: string
              duration:
                description: Duration is the total adapter run duration.
                type: string
              observedAt:
                description: ObservedAt is when the adapter run completed.
                format: date-time
                type: string
              result:
                description: Result is the aggregate outcome across all checks.
                enum:
                - Pass
                - Warn
                - Fail
                - Error
                - Skipped
                - Unknown
                type: string
              sourceRef:
                description: SourceRef identifies the check resource that produced
                  this report.
                properties:
                  apiVersion:
                    description: APIVersion is the target object's API version.
                    maxLength: 253
                    type: string
                  kind:
                    description: Kind is the target object's kind.
                    maxLength: 63
                    type: string
                  name:
                    description: Name is the target object's name.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace is the target object's namespace, if namespaced.
                    maxLength: 253
                    type: string
                required:
                - name
                type: object
            required:
            - observedAt
            - result
            - sourceRef
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: HealthReportStatus defines the observed state of HealthReport.
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
