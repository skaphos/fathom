---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: nodehealthchecks.fathom.skaphos.io
spec:
  group: fathom.skaphos.io
  names:
    categories:
    - fathom
    kind: NodeHealthCheck
    listKind: NodeHealthCheckList
    plural: nodehealthchecks
    singular: nodehealthcheck
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.lastResult
      name: Result
      type: string
    - jsonPath: .status.reportingNodes
      name: Reporting
      type: integer
    - jsonPath: .status.desiredNodes
      name: Desired
      type: integer
    - jsonPath: .status.lastRunTime
      name: Last Run
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NodeHealthCheck is the Schema for the nodehealthchecks API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NodeHealthCheckSpec defines the desired state of NodeHealthCheck.

              A NodeHealthCheck asserts a set of node-local health signals on every
              selected node — filesystem headroom, the node's own conditions, kubelet
              health, and container-runtime liveness — and reports one verdict per node
              plus a single folded verdict for the check. The node-local signals are
              collected by the same hardened node-agent DaemonSet NodeCertificateCheck
              uses; the operator rolls the per-node reports into a HealthReport and
              mirrors the aggregate into Status.

              There is no field to pause a NodeHealthCheck. Stopping a check means
              deleting it (#262).
              The comparison uses the effective interval: an omitted interval is 5m at
              runtime, so timeout: 10m without an interval is rejected here rather than
              admitted and silently capped. Keep the literal in step with
              DefaultNodeHealthCheckInterval.
              Per-node results and HealthReport checks are keyed by the item's identity —
              its type plus what it measures: the path for the headroom types, the socket
              for ContainerRuntime (its default counts as a value), nothing for the
              rest — so two items with the same identity would collide there. Rejecting
              the duplicate at write time is far kinder than a status update failing
              later with an error that says nothing about the specification that caused
              it. Two ContainerRuntime items with different sockets are distinct. The
              pathless types key on their own type name rather than an empty string:
              gofmt rewrites two adjacent apostrophes inside a doc comment as a
              typographic quote, which would silently break the rule at CRD install.
              A headroom path that is also a ContainerRuntime socket would be mounted
              twice at one mountPath — as a DirectoryOrCreate directory and as a Socket —
              which the kubelet rejects, and a directory mount over a socket is
              meaningless anyway. The socket's default counts as a value.
            properties:
              checks:
                description: |-
                  Checks are the assertions made on every node in scope. At least one is
                  required — a check with no items would report a vacuous pass.
                items:
                  description: |-
                    NodeHealthCheckItem is one assertion made on every node in scope. Which
                    fields are legal depends on Type; the rules below reject a field on a type
                    that does not use it, so a misapplied threshold is a write-time error and
                    not a silently ignored one.
                    The relation is checked on the effective values: an omitted threshold
                    counts as its runtime default, so criticalPercentFree: 30 with warn omitted
                    (effective warn 20) and warnPercentFree: 0 with critical omitted (effective
                    critical 10) are rejected here rather than silently clamped at run time.
                    The path allowlist stops a namespaced tenant from turning the node-agent into
                    a confused deputy that mounts arbitrary host directories; it is mirrored in
                    internal/nodehealth so the operator re-checks it on clusters running an older
                    CRD. The host root is never allowed: statfs of /var/lib/kubelet reports the
                    root filesystem on any node where it is not a separate mount.
                  properties:
                    conditions:
                      description: |-
                        Conditions names the node condition types a NodeCondition check asserts.
                        Ready is expected True; every other listed condition is expected False,
                        which is the healthy value for every pressure and unavailability
                        condition Kubernetes and the cloud providers define. Defaults to Ready,
                        MemoryPressure, DiskPressure, and PIDPressure when unset. A condition the
                        node does not report is Skipped, not Fail. Applies only to NodeCondition.
                      items:
                        maxLength: 63
                        minLength: 1
                        type: string
                      maxItems: 16
                      type: array
                      x-kubernetes-list-type: set
                    criticalPercentFree:
                      description: |-
                        CriticalPercentFree is the percentage of free space (or inodes) at or
                        below which the check is Fail. Applies only to the headroom types.
                        Defaults to 10 (DefaultNodeHealthCriticalPercentFree) when unset.
                      format: int32
                      maximum: 100
                      minimum: 0
                      type: integer
                    path:
                      description: |-
                        Path is a location on the filesystem whose headroom is measured. Required
                        for DiskHeadroom and InodeHeadroom and rejected for every other type. The
                        operator mounts it into the agent read-only, so it must be a traversal-free
                        absolute path under one of the operator-approved prefixes.

                        The mounted directory is created empty by the kubelet when it does not
                        exist on a node (hostPath DirectoryOrCreate, as for NodeCertificateCheck),
                        so the measurement is then the headroom of the filesystem that would hold
                        it — usually the root filesystem — and the node's filesystem is mutated
                        by that directory. Prefer paths that exist on every node in scope. Only a
                        path that is missing beneath the mount (a subdirectory the agent cannot
                        stat) is reported Skipped.
                      maxLength: 512
                      type: string
                    socketPath:
                      description: |-
                        SocketPath is the CRI socket a ContainerRuntime check dials. Defaults to
                        /run/containerd/containerd.sock when unset. The operator mounts the socket
                        itself (hostPath type Socket), so a node without a socket at this path
                        cannot schedule the agent and surfaces as incomplete coverage rather than
                        as a verdict. Applies only to ContainerRuntime.
                      maxLength: 512
                      type: string
                    type:
                      description: |-
                        Type is the assertion this item makes. See NodeHealthCheckType for the
                        privilege each type costs the node-agent.
                      enum:
                      - DiskHeadroom
                      - InodeHeadroom
                      - NodeCondition
                      - KubeletHealthz
                      - ContainerRuntime
                      type: string
                    warnPercentFree:
                      description: |-
                        WarnPercentFree is the percentage of free space (or inodes) at or below
                        which the check is Warn. Applies only to the headroom types. Defaults to
                        20 (DefaultNodeHealthWarnPercentFree) when unset. Must be greater than or
                        equal to CriticalPercentFree.
                      format: int32
                      maximum: 100
                      minimum: 0
                      type: integer
                  required:
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: path is required for DiskHeadroom and InodeHeadroom,
                      and must be omitted for every other type
                    rule: (self.type == 'DiskHeadroom' || self.type == 'InodeHeadroom')
                      == has(self.path)
                  - message: warnPercentFree and criticalPercentFree apply only to
                      DiskHeadroom and InodeHeadroom
                    rule: self.type == 'DiskHeadroom' || self.type == 'InodeHeadroom'
                      || (!has(self.warnPercentFree) && !has(self.criticalPercentFree))
                  - message: warnPercentFree must be greater than or equal to criticalPercentFree;
                      an omitted field counts as its default (warn 20, critical 10)
                    rule: '(has(self.warnPercentFree) ? self.warnPercentFree : 20)
                      >= (has(self.criticalPercentFree) ? self.criticalPercentFree
                      : 10)'
                  - message: conditions applies only to NodeCondition
                    rule: self.type == 'NodeCondition' || !has(self.conditions)
                  - message: socketPath applies only to ContainerRuntime
                    rule: self.type == 'ContainerRuntime' || !has(self.socketPath)
                  - message: path must be an absolute, traversal-free path under an
                      allowed prefix (/var/lib/kubelet, /var/lib/containerd, /var/lib/docker,
                      /var/lib/etcd, /var/log, /var/lib/rancher, /etc/kubernetes,
                      /run/containerd)
                    rule: '!has(self.path) || (self.path.startsWith(''/'') && self.path
                      != ''/'' && !self.path.contains(''..'') && [''/var/lib/kubelet'',''/var/lib/containerd'',''/var/lib/docker'',''/var/lib/etcd'',''/var/log'',''/var/lib/rancher'',''/etc/kubernetes'',''/run/containerd''].exists(a,
                      self.path == a || self.path.startsWith(a + ''/'')))'
                  - message: socketPath must be a traversal-free .sock path under
                      an allowed runtime directory (/run/containerd, /var/run/containerd,
                      /run/crio, /var/run/crio, /run/k3s/containerd, /var/run/k3s/containerd,
                      /run/cri-dockerd, /var/run/cri-dockerd) or the cri-dockerd socket
                      itself (/run/cri-dockerd.sock, /var/run/cri-dockerd.sock)
                    rule: '!has(self.socketPath) || (self.socketPath.endsWith(''.sock'')
                      && !self.socketPath.contains(''..'') && ([''/run/containerd'',''/var/run/containerd'',''/run/crio'',''/var/run/crio'',''/run/cri-dockerd'',''/var/run/cri-dockerd'',''/run/k3s/containerd'',''/var/run/k3s/containerd''].exists(a,
                      self.socketPath.startsWith(a + ''/'')) || [''/run/cri-dockerd.sock'',''/var/run/cri-dockerd.sock''].exists(f,
                      self.socketPath == f)))'
                maxItems: 16
                minItems: 1
                type: array
              historyLimit:
                default: 10
                description: |-
                  HistoryLimit caps the number of HealthReports retained for this check.
                  The minimum of 1 keeps Status.LastReportName valid.
                format: int32
                minimum: 1
                type: integer
              includeControlPlaneNodes:
                default: false
                description: |-
                  IncludeControlPlaneNodes opts the node-agent into scheduling on
                  control-plane nodes by adding tolerations for the standard control-plane
                  and legacy master taints on top of any Tolerations. It defaults to false:
                  a KubeletHealthz or ContainerRuntime check runs the agent with host
                  network or as root, so landing it on a control-plane node is a decision
                  the author makes, not a default.
                type: boolean
              interval:
                description: |-
                  Interval is the cadence at which the operator refreshes the rolled-up
                  HealthReport (the roll-up transition cadence). Defaults to 5m when
                  unset. Must be at least 10s (MinCheckInterval); the operator clamps
                  stored objects that predate this floor to it at runtime.

                  The runtime cadence is capped: the node-agent re-evaluates at
                  min(interval, 5m), the operator reconciles and refreshes
                  status.lastRunTime on that same cadence (so a silently dead agent is
                  noticed within minutes and a healthy check never reads as stale), and a
                  report counts as fresh for one full agent cycle — that cadence plus
                  three times the capped Timeout. A value above 5m therefore has no
                  further runtime effect; HealthReports are written only when the verdict
                  transitions, whatever the interval.
                  Headroom, kubelet, and runtime liveness change on the order of minutes,
                  so a long interval must not accept a measurement that old: a 24h
                  interval still detects a disk filling up within minutes. Unchanged
                  evaluations refresh only status liveness (LastRunTime); a new
                  HealthReport is written only when the verdict transitions.
                type: string
              metricsHostPort:
                description: |-
                  MetricsHostPort is the host port a host-network agent (one running a
                  KubeletHealthz item) serves its metrics on. When unset, the operator
                  derives a port in 30000–32767 from the check's namespaced name; that
                  derivation is a hash, so two host-network checks scheduled on the same
                  node can collide, which surfaces as the second agent crash-looping
                  (AgentReady=False) and is reported on the AgentPrivileged condition. Set
                  this to resolve such a collision, or to avoid an unrelated host listener.
                  Ignored for a check without a host-network item.
                format: int32
                maximum: 65535
                minimum: 1024
                type: integer
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  NodeSelector restricts which nodes run the agent DaemonSet. An empty
                  selector targets every node.
                type: object
              timeout:
                description: |-
                  Timeout bounds a single node-agent evaluation pass, including the kubelet
                  and runtime-socket probes. Defaults to 30s when unset. Must be at least 1s
                  (MinCheckTimeout) and must not exceed Interval.
                type: string
              tolerations:
                description: |-
                  Tolerations are applied verbatim to the agent DaemonSet so it can schedule
                  onto nodes carrying arbitrary taints. Control-plane tolerations are NOT
                  added here — use IncludeControlPlaneNodes for that, so scheduling the
                  agent onto control-plane nodes is always an explicit, auditable opt-in.

                  An omitted list and an empty list mean the same thing: no tolerations.
                  The operator never distinguishes the two, so the nil-vs-empty round-trip
                  the sibling kind carries (#150) has no effect here.
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                        Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
            required:
            - checks
            type: object
            x-kubernetes-validations:
            - message: timeout must be at least 1s
              rule: '!has(self.timeout) || duration(self.timeout) >= duration(''1s'')'
            - message: interval must be at least 10s
              rule: '!has(self.interval) || duration(self.interval) >= duration(''10s'')'
            - message: timeout must not exceed interval (5m when interval is omitted)
              rule: '!has(self.timeout) || duration(self.timeout) <= (has(self.interval)
                ? duration(self.interval) : duration(''5m''))'
            - message: checks must be unique by type and path (socketPath for ContainerRuntime)
              rule: 'self.checks.all(c, self.checks.filter(o, o.type == c.type &&
                (has(o.path) ? o.path : (o.type == ''ContainerRuntime'' ? ((has(o.socketPath)
                && size(o.socketPath) > 0) ? o.socketPath : ''/run/containerd/containerd.sock'')
                : o.type)) == (has(c.path) ? c.path : (c.type == ''ContainerRuntime''
                ? ((has(c.socketPath) && size(c.socketPath) > 0) ? c.socketPath :
                ''/run/containerd/containerd.sock'') : c.type))).size() == 1)'
            - message: a headroom path must not be a ContainerRuntime socket path
              rule: '!self.checks.exists(h, (h.type == ''DiskHeadroom'' || h.type
                == ''InodeHeadroom'') && self.checks.exists(r, r.type == ''ContainerRuntime''
                && (has(r.socketPath) ? r.socketPath : ''/run/containerd/containerd.sock'')
                == h.path))'
          status:
            description: NodeHealthCheckStatus defines the observed state of NodeHealthCheck.
            properties:
              conditions:
                description: |-
                  Conditions summarize whether the controller accepted the spec, whether
                  the agent DaemonSet is rolled out and reporting, and whether the current
                  verdict was computed from a complete scan of the fleet.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              desiredNodes:
                description: |-
                  DesiredNodes is the number of nodes the agent DaemonSet targets
                  (DaemonSet status DesiredNumberScheduled).
                format: int32
                type: integer
              lastReportName:
                description: |-
                  LastReportName names the HealthReport capturing the current aggregate
                  result. A new HealthReport is written only when that result transitions,
                  so this name is stable across polls that observe the same result.
                maxLength: 253
                type: string
              lastResult:
                description: |-
                  LastResult is the aggregate result across every node in scope as of the
                  most recent complete evaluation. An incomplete window (a rollout, a node
                  joining, an agent restart) freezes it rather than clearing it; the
                  CoverageComplete condition says which.
                enum:
                - Pass
                - Warn
                - Fail
                - Error
                - Skipped
                - Unknown
                type: string
              lastRunTime:
                description: |-
                  LastRunTime records when the operator last evaluated the node-agent
                  results. It is refreshed on the capped agent cadence, min(interval, 5m),
                  even when the aggregate is unchanged, so downstream liveness stays
                  fresh, and never moves backward: an incomplete window freezes it along
                  with the verdict.
                format: date-time
                type: string
              lastRunTrigger:
                description: |-
                  LastRunTrigger records the fathom.skaphos.io/run-now annotation value
                  most recently consumed. A new value is carried to the node-agents through
                  their DaemonSet template, which restarts them; each agent stamps the value
                  into its report, and the operator records it here only once every node in
                  scope has a fresh report carrying it. Until then the previous verdict is
                  kept. A given on-demand trigger therefore completes exactly once.
                maxLength: 253
                type: string
              nodeResults:
                description: |-
                  NodeResults holds one entry per node in the most recent complete
                  evaluation, sorted by node name, as bounded per-node detail. Capped at
                  100 entries, so in a larger fleet a node can be absent here although it
                  reported; the fleet-wide coverage signal is the CoverageComplete
                  condition, which names the nodes that have not reported. The verdict and
                  coverage are computed across every node before truncation. Like
                  LastResult it is frozen, not cleared, across an incomplete window.
                items:
                  description: |-
                    NodeHealthNodeResult is the folded verdict for one node on the most recent
                    complete evaluation.
                  properties:
                    message:
                      description: |-
                        Message summarises the worst check on the node, so a failing node is
                        triaged without opening the HealthReport.
                      maxLength: 512
                      type: string
                    node:
                      description: Node is the node the result belongs to.
                      maxLength: 253
                      type: string
                    observedAt:
                      description: ObservedAt is when the node's report was produced.
                      format: date-time
                      type: string
                    result:
                      description: Result is the worst outcome across every check
                        evaluated on this node.
                      enum:
                      - Pass
                      - Warn
                      - Fail
                      - Error
                      - Skipped
                      - Unknown
                      type: string
                  required:
                  - node
                  - result
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-map-keys:
                - node
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent metadata.generation reconciled by
                  the controller.
                format: int64
                type: integer
              reportingNodes:
                description: |-
                  ReportingNodes is the number of fresh, well-formed reports the operator
                  found at its latest reconcile, including surplus reports from nodes that
                  have since left scope. It is refreshed every reconcile, so it can change
                  while LastResult and NodeResults are frozen across an incomplete window;
                  it is a liveness count, not the coverage signal — CoverageComplete is.
                format: int32
                type: integer
              summary:
                description: |-
                  Summary is a human-readable one-line outcome naming how many nodes
                  passed and, when some did not, the worst of them.
                maxLength: 1024
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
