# This role is not used by the operator itself.
# It is provided so cluster admins can grant people and CI jobs everything the
# fathomctl CLI needs, including `fathomctl run`: the viewer rules plus patch on
# the three executable check kinds, which is how the CLI writes the
# fathom.skaphos.io/run-now trigger annotation. RBAC cannot scope patch to
# metadata alone, so this grant also permits spec edits; bind it only to
# subjects that are trusted to trigger runs. See docs/reference/fathomctl.md.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: fathom
    app.kubernetes.io/managed-by: kustomize
  name: fathomctl-runner-role
rules:
- apiGroups:
  - fathom.skaphos.io
  resources:
  - addonchecks
  - dnschecks
  - nodecertificatechecks
  - healthchecks
  - clusterhealths
  - healthreports
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - fathom.skaphos.io
  resources:
  - addonchecks/status
  - dnschecks/status
  - nodecertificatechecks/status
  - healthchecks/status
  - clusterhealths/status
  verbs:
  - get
- apiGroups:
  - fathom.skaphos.io
  resources:
  - addonchecks
  - dnschecks
  - nodecertificatechecks
  verbs:
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
