#
# Target fixture for scripts/check_crd_compat_test.go: the baseline CRD with
# its only served version replaced by v1. The allowlist fixture sanctions this
# CRD with path "*".
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.com
spec:
  group: example.com
  names:
    kind: Widget
    listKind: WidgetList
    plural: widgets
    singular: widget
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              name:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
