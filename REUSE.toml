version = 1
SPDX-PackageName = "fathom"
SPDX-PackageDownloadLocation = "https://github.com/skaphos/fathom"

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Skaphos"
SPDX-License-Identifier = "MIT"

# Vendored from GitHub's spec-kit (https://github.com/github/spec-kit) by
# `specify integration install claude` / `codex` (one skill root per agent),
# which write these files without SPDX headers. The blanket "**" rule above would otherwise have Fathom claiming
# Skaphos copyright over upstream content. Both projects are MIT, so only the
# copyright holder differs. Regenerated by the tool, never hand-edited — see
# .specify/integrations/<agent>.manifest.json for the checksums it verifies.
[[annotations]]
path = [".claude/skills/speckit-*/**", ".agents/skills/speckit-*/**"]
precedence = "override"
SPDX-FileCopyrightText = "GitHub, Inc. and spec-kit contributors"
SPDX-License-Identifier = "MIT"

# Skaphos-authored additions synced from skaphos-resources/llm_resources/speckit
# share the speckit-* prefix but are not upstream content. Listed after the
# spec-kit rule so this narrower match wins.
[[annotations]]
path = [
  ".claude/skills/speckit-adversarial-review/**",
  ".agents/skills/speckit-adversarial-review/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Skaphos"
SPDX-License-Identifier = "MIT"
