{{- /*
Only meaningful when metrics are actually served and exposed by a Service:
gate on (serviceMonitor.enabled OR the Sumo Logic preset) AND a real bind
address AND the metrics Service. The Sumo preset adds the release label its
Target Allocator selects on; explicit serviceMonitor.labels win on conflict.
*/ -}}
{{- $sumo := .Values.metrics.integrations.sumologic }}
{{- if and (or .Values.metrics.serviceMonitor.enabled $sumo.enabled) (ne .Values.metrics.bindAddress "0") .Values.metrics.service.enabled -}}
{{- $labels := deepCopy (.Values.metrics.serviceMonitor.labels | default dict) }}
{{- if $sumo.enabled }}
{{- $labels = merge $labels (dict "release" $sumo.releaseName) }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "fathom-operator.fullname" . }}
  namespace: {{ .Values.metrics.serviceMonitor.namespace | default .Release.Namespace }}
  labels:
    {{- include "fathom-operator.labels" . | nindent 4 }}
    {{- with $labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "fathom-operator.selectorLabels" . | nindent 6 }}
      control-plane: controller-manager
  endpoints:
    - port: metrics
      scheme: {{ if .Values.metrics.secure }}https{{ else }}http{{ end }}
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      {{- if .Values.metrics.secure }}
      {{- /*
      The scraper sends its own ServiceAccount token, so the serving certificate
      must be verified. In order:
        1. an explicit metrics.serviceMonitor.tlsConfig is used verbatim (the
           only way to opt into insecureSkipVerify: true);
        2. with a mounted CA-signed metrics certificate (certSecretName) and
           the ServiceMonitor in the release namespace, verify against that
           Secret's ca.crt and the metrics Service's DNS name;
        3. otherwise refuse to render. The controller-runtime default
           certificate is self-signed and regenerated on every start, so it
           cannot be pinned.
      */}}
      {{- $smNamespace := .Values.metrics.serviceMonitor.namespace | default .Release.Namespace }}
      {{- $tls := .Values.metrics.serviceMonitor.tlsConfig }}
      {{- if and (not $tls) .Values.metrics.certSecretName (eq $smNamespace .Release.Namespace) }}
      {{- $tls = dict
            "ca" (dict "secret" (dict "name" .Values.metrics.certSecretName "key" "ca.crt"))
            "serverName" (printf "%s-metrics.%s.svc" (include "fathom-operator.fullname" .) .Release.Namespace)
            "insecureSkipVerify" false }}
      {{- end }}
      {{- if not $tls }}
      {{- fail "metrics.serviceMonitor: the scraper sends its ServiceAccount token to the metrics endpoint, so its certificate must be verified. Serve a CA-signed metrics certificate (metrics.certSecretName, whose Secret carries ca.crt; the ServiceMonitor must be in the release namespace) or set metrics.serviceMonitor.tlsConfig explicitly — {insecureSkipVerify: true} accepts the risk." }}
      {{- end }}
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        {{- toYaml $tls | nindent 8 }}
      {{- end }}
{{- end }}
