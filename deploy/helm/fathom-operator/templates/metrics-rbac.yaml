{{- if and .Values.rbac.create .Values.metrics.secure (ne .Values.metrics.bindAddress "0") -}}
{{/*
Secure metrics use controller-runtime's built-in authn/authz filter (no
kube-rbac-proxy). The operator must be able to create TokenReviews and
SubjectAccessReviews to authenticate and authorize scrapers. Mirrors
config/rbac/metrics_auth_role.yaml. Gated on secure metrics being served.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "fathom-operator.fullname" . }}-metrics-auth
  labels:
    {{- include "fathom-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "fathom-operator.fullname" . }}-metrics-auth
  labels:
    {{- include "fathom-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "fathom-operator.fullname" . }}-metrics-auth
subjects:
  - kind: ServiceAccount
    name: {{ include "fathom-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{/*
Allows clients holding this role to scrape /metrics. Mirrors
config/rbac/metrics_reader_role.yaml. Bound to the identities listed in
metrics.reader.subjects (e.g. a Prometheus, Sumo Logic collector or Dynatrace
ActiveGate ServiceAccount); with no subjects it is left for you to bind.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "fathom-operator.fullname" . }}-metrics-reader
  labels:
    {{- include "fathom-operator.labels" . | nindent 4 }}
rules:
  - nonResourceURLs:
      - "/metrics"
    verbs:
      - get
{{- $subjects := .Values.metrics.reader.subjects | default list }}
{{- with .Values.metrics.integrations.dynatrace }}
{{- if .enabled }}
{{- $subjects = append $subjects (dict "kind" "ServiceAccount" "name" .activeGateServiceAccount.name "namespace" .activeGateServiceAccount.namespace) }}
{{- end }}
{{- end }}
{{- with .Values.metrics.integrations.dynatrace }}
{{- if and .enabled .caConfigMap.name }}
{{- $ns := .caConfigMap.namespace | default $.Release.Namespace }}
---
{{/*
Dynatrace resolves metrics.dynatrace.com/tls.ca.crt through the ActiveGate's
own identity, which has no ConfigMap access by default. Grant it get on that
one ConfigMap and nothing else.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "fathom-operator.fullname" $ }}-dynatrace-metrics-ca
  namespace: {{ $ns }}
  labels:
    {{- include "fathom-operator.labels" $ | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - {{ .caConfigMap.name }}
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "fathom-operator.fullname" $ }}-dynatrace-metrics-ca
  namespace: {{ $ns }}
  labels:
    {{- include "fathom-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "fathom-operator.fullname" $ }}-dynatrace-metrics-ca
subjects:
  - kind: ServiceAccount
    name: {{ .activeGateServiceAccount.name }}
    namespace: {{ .activeGateServiceAccount.namespace }}
{{- end }}
{{- end }}
{{- with $subjects }}
---
{{/*
Grants the scrapers in metrics.reader.subjects get on /metrics and nothing
else: this binding's only role is the metrics-reader role above.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "fathom-operator.fullname" $ }}-metrics-reader
  labels:
    {{- include "fathom-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "fathom-operator.fullname" $ }}-metrics-reader
subjects:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
