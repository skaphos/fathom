{{- /*
Opt-in alert rules over the fathom_* metric contract (skaphos/fathom#276).
Fathom emits signal; it does not decide what pages whom. By default this
renders the SAMPLE rule groups synced from config/components/prometheus-rule
(files/prometheus-rule-groups.yaml, regenerated by `task helm:sync`) — a worked
example to review and adapt. Set metrics.prometheusRule.groups to render your
own rule groups instead. Requires the prometheus-operator CRDs.
*/ -}}
{{- if .Values.metrics.prometheusRule.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "fathom-operator.fullname" . }}
  namespace: {{ .Values.metrics.prometheusRule.namespace | default .Release.Namespace }}
  labels:
    {{- include "fathom-operator.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
  {{- if .Values.metrics.prometheusRule.groups }}
    {{- toYaml .Values.metrics.prometheusRule.groups | nindent 4 }}
  {{- else }}
    {{- .Files.Get "files/prometheus-rule-groups.yaml" | nindent 4 }}
  {{- end }}
{{- end }}
