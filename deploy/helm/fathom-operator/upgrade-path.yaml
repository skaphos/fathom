#
# Stops and sanctioned incompatible CRD changes, one entry per release that has
# either. Maintained in the release PR; see RELEASE.md. Read by fathomctl from
# its embedded chart (skaphos/fathom#330; contract:
# specs/013-fathomctl-lifecycle/contracts/upgrade-path.md).
#
# Append-only: entries for a released version are never edited or removed, so
# every later fathomctl knows every earlier stop. scripts/upgrade_path_gate_test.go
# enforces that, and that every SANCTIONED crd-compat finding has an entry here.
#
#   floor                  oldest version this data covers; never changed.
#   releases[].version     semver without v; strictly increasing.
#   releases[].stop        an upgrade from below this version to above it must
#                          install it first (default false). Make a release a
#                          stop when existing resources need its operator to
#                          migrate before a later schema accepts them.
#   releases[].sanctioned  incompatible CRD changes the release deliberately
#                          makes: crd (metadata.name), path (crdify property
#                          path, or "*"), reason and issue (shown verbatim).
#                          `upgrade` applies them only with
#                          --accept-incompatible-crds.
floor: 0.5.0
releases:
  # Neither change needs an intermediate operator to migrate data, so 0.6.0 is
  # not a stop: later releases may upgrade straight from v0.5.x (2026-10-11).
  - version: 0.6.0
    stop: false
    sanctioned:
      - crd: clusterhealths.fathom.skaphos.io
        path: ^.status.children
        reason: status.children capped at 100 items; previously unbounded, so one selector could grow the stored object without limit. The controller truncates worst-verdict-then-stalest first and computes result/observedAt across every selected check before truncating, so the cap bounds what is reported, never what is measured, and cannot fail a status write. Sanctioned v1alpha1 churn.
        issue: https://github.com/skaphos/fathom/issues/277
      - crd: healthchecks.fathom.skaphos.io
        path: ^.spec.checkRef.apiVersion
        reason: checkRef.apiVersion bounded to Kubernetes' 317-character API-version limit while remaining enum-free for migration safety; sanctioned v1alpha1 validation hardening.
        issue: https://github.com/skaphos/fathom/issues/267
  # 0.7.0 promotes the seven check kinds to the stable v1 and stops serving
  # v1alpha1 (skaphos/fathom#149, spec 014, ADR 0009). The API server refuses
  # to drop a version a CRD still stores, so each promoted CRD is replaced:
  # deleted together with its alpha resources, then created at v1. That makes
  # 0.7.0 a stop — it is the release whose fathomctl carries the alpha-aware
  # `export` that renders the resources to recreate — and every promoted CRD a
  # "*" sanction, which `upgrade` applies only with --accept-incompatible-crds
  # when alpha resources exist (an empty inventory needs the sanction alone).
  - version: 0.7.0
    stop: true
    sanctioned:
      - crd: addonchecks.fathom.skaphos.io
        path: "*"
        reason: served version replaced (v1alpha1 removed, v1 added); alpha AddonChecks and their HealthReport history are deleted with the CRD — run `fathomctl export` first and recreate from the output
        issue: https://github.com/skaphos/fathom/issues/149
      - crd: healthchecks.fathom.skaphos.io
        path: "*"
        reason: served version replaced (v1alpha1 removed, v1 added); alpha HealthChecks are deleted with the CRD — run `fathomctl export` first and recreate from the output
        issue: https://github.com/skaphos/fathom/issues/149
      - crd: clusterhealths.fathom.skaphos.io
        path: "*"
        reason: served version replaced (v1alpha1 removed, v1 added); alpha ClusterHealths are deleted with the CRD — run `fathomctl export` first and recreate from the output
        issue: https://github.com/skaphos/fathom/issues/149
      - crd: healthreports.fathom.skaphos.io
        path: "*"
        reason: served version replaced (v1alpha1 removed, v1 added); alpha HealthReport history is deleted with the CRD and is not exported
        issue: https://github.com/skaphos/fathom/issues/149
      - crd: nodecertificatechecks.fathom.skaphos.io
        path: "*"
        reason: served version replaced (v1alpha1 removed, v1 added); alpha NodeCertificateChecks are deleted with the CRD — run `fathomctl export` first and recreate from the output
        issue: https://github.com/skaphos/fathom/issues/149
      - crd: dnschecks.fathom.skaphos.io
        path: "*"
        reason: served version replaced (v1alpha1 removed, v1 added); alpha DNSChecks are deleted with the CRD — run `fathomctl export` first and recreate from the output
        issue: https://github.com/skaphos/fathom/issues/149
      - crd: nodehealthchecks.fathom.skaphos.io
        path: "*"
        reason: served version replaced (v1alpha1 removed, v1 added); alpha NodeHealthChecks are deleted with the CRD — run `fathomctl export` first and recreate from the output
        issue: https://github.com/skaphos/fathom/issues/149
